version: 2
updates:
  # GitHub Actions used in the workflows above.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # npm dependencies — grouped so related bumps land in one PR.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      lint-and-format:
        patterns:
          - eslint
          - 'eslint-*'
          - '@typescript-eslint/*'
          - typescript-eslint
          - prettier
          - 'prettier-*'
          - stylelint
          - 'stylelint-*'
          - 'markdownlint-*'
          - cspell
