name: CI

# Runs on pull requests into master and on pushes to any other branch.
# Pushes to master are handled by deploy.yml (which re-runs verify + build
# before deploying), so we skip master here to avoid a duplicate build.
on:
  pull_request:
    branches: [master]
  push:
    branches-ignore: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type-check, lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (astro check)
        run: npm run check

      - name: Lint (eslint + stylelint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Build (Astro + Pagefind)
        run: npm run build
        env:
          PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}

      - name: Upload build for audits
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  audits:
    name: Advisory audits (Lighthouse · pa11y · links)
    runs-on: ubuntu-latest
    needs: quality
    # Advisory only: these report results but must never block a PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Serve built site
        run: nohup npx --yes http-server dist -p 4321 --silent > /dev/null 2>&1 &

      - name: Wait for server
        run: npx --yes wait-on http://127.0.0.1:4321

      - name: Lighthouse CI (perf · a11y · best-practices · SEO)
        run: npx --yes @lhci/cli@0.14.x autorun
        continue-on-error: true

      - name: Accessibility (pa11y-ci)
        run: npx --yes pa11y-ci --config .pa11yci.json
        continue-on-error: true

      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress './dist/**/*.html'
          fail: false
