##############################################################
# GitHub Actions — Deploy Jekyll site to GitHub Pages
# Triggers on every push to main branch
##############################################################

name: "Deploy to GitHub Pages"

on:
  push:
    branches:
      - "master"
  workflow_dispatch:

permissions:
  contents: read
  pages:    write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # ── Job 1: Build the Jekyll site ────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v5

      - name: "⚙️ Set up Ruby 3.1"
        uses: ruby/setup-ruby@v1
        with:
          # Ruby 3.1 is the newest release that still ships Object#tainted?,
          # which the github-pages gem's Liquid 4.0.3 requires (removed in Ruby 3.2+).
          ruby-version: "3.1"
          bundler-cache: false   # we run bundle install manually below

      - name: "📦 Install gems"
        run: bundle install --jobs 4 --retry 3

      - name: "🔑 Inject Umami website ID"
        run: |
          sed -i 's/UMAMI_WEBSITE_ID_PLACEHOLDER/${{ secrets.UMAMI_WEBSITE_ID }}/g' _includes/analytics.html

      - name: "🔧 Configure GitHub Pages"
        uses: actions/configure-pages@v6
        id: pages

      - name: "🏗️ Build with Jekyll"
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: "🗜️ Upload site artifact"
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./_site"

  # ── Job 2: Deploy to GitHub Pages ───────────────────────
  deploy:
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: "🚀 Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4