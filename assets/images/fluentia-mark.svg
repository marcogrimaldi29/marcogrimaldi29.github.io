<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Fluentia logo: speech bubble with ascending fluency bars">
  <!--
    Fluentia brand mark — "Fluency, engineered."
    Speech bubble  = language & dialogue
    Ascending bars = CEFR progression (A1 → C2) and the data-driven platform
    Gradient       = marcogrimaldi29.com sunrise palette (green → teal → blue)
  -->
  <defs>
    <linearGradient id="mg" gradientUnits="userSpaceOnUse" x1="70" y1="150" x2="442" y2="380">
      <stop offset="0" stop-color="#3dba7e"/>
      <stop offset="0.55" stop-color="#2cc5c5"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- speech bubble body -->
  <rect x="70" y="88" width="372" height="288" rx="92" fill="url(#mg)"/>
  <!-- speech bubble tail (bottom-left) -->
  <path d="M150 340 L150 452 Q150 470 167 457 L268 376 Z" fill="url(#mg)"/>

  <!-- ascending fluency bars -->
  <rect x="152" y="240" width="54" height="88"  rx="27" fill="#ffffff"/>
  <rect x="229" y="188" width="54" height="140" rx="27" fill="#ffffff"/>
  <rect x="306" y="136" width="54" height="192" rx="27" fill="#ffffff"/>
</svg>
